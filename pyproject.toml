[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-system"
version = "0.1.0"
description = "Modular monorepo: crypto research, strategy, paper trading and infrastructure modules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ehsan" }]

# This pyproject represents the repository as a whole. It is intentionally
# dependency-free: each module owns its dependencies and is installed
# individually, e.g.
#
#     pip install -e modules/research[dev]
#
# Cross-module dependencies must go through explicit interfaces (see
# shared/README.md). Do not add module dependencies here.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
